<!doctype html>
<html lang='zh-CN'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<meta name='theme-color' content='#f5f1e8'>
<meta name='apple-mobile-web-app-capable' content='yes'>
<meta name='apple-mobile-web-app-title' content='上岸计时局'>
<title>上岸计时局</title>
<style>
:root{--bg:#f5f1e8;--card:#fffdf8;--ink:#232a28;--muted:#6f7773;--line:#ded8cc;--green:#2e6a54;--light:#d9eadc;--orange:#ec7f4d;--soft:#f7d9c9;--blue:#6289b8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#fff 0 18%,transparent 34%),linear-gradient(145deg,var(--bg),#eee8dc);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{width:min(1180px,calc(100% - 28px));margin:auto;padding:18px 0 46px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.brand{display:flex;gap:12px;align-items:center}.mark{width:42px;height:42px;border-radius:14px;background:var(--ink);box-shadow:5px 5px 0 var(--soft);position:relative;transform:rotate(-4deg)}.mark:before{content:'';position:absolute;width:18px;height:4px;background:white;border-radius:9px;left:12px;top:24px}.mark:after{content:'';position:absolute;width:8px;height:8px;background:white;border-radius:50%;left:12px;top:11px}.brand b{display:block;font-size:18px}.brand small,.chip{color:var(--muted);font-size:12px}.chip{padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:#fff8}.grid{display:grid;grid-template-columns:1.55fr .95fr;gap:16px}.card{background:#fffdf8e8;border:1px solid var(--line);border-radius:24px;box-shadow:0 16px 45px #3b3d3220;padding:24px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{margin:0 0 6px;color:var(--orange);font-size:10px;font-weight:800;letter-spacing:.18em}h1,h2,p{margin-top:0}h1{font-size:25px}h2{font-size:19px}.switch{display:flex;background:#eee8dc;border-radius:13px;padding:4px;border:1px solid var(--line)}.switch button{border:0;background:transparent;padding:9px 16px;border-radius:10px;color:var(--muted);font-weight:800}.switch button.on{background:white;color:var(--ink);box-shadow:0 4px 12px #0001}.fields,.task-form,.note-form{display:grid;gap:9px}.fields{grid-template-columns:1fr 1fr;margin-top:18px}.task-form{grid-template-columns:1fr 96px 88px auto}.note-form{grid-template-columns:90px 1fr 88px auto}input,select,textarea{border:1px solid var(--line);border-radius:12px;background:white;padding:11px 12px;outline:0}textarea{resize:vertical;min-height:48px}.timer{display:grid;place-items:center;min-height:330px}.ring{width:274px;height:274px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) var(--deg,0deg),#e6e0d6 0);box-shadow:0 20px 45px #2e6a5422}.inner{width:242px;height:242px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 20%,#fff,#fbf7ef 62%,#f0eadf)}.inner div{text-align:center}.status{display:block;color:var(--orange);font-size:11px;font-weight:900;letter-spacing:.16em;margin-bottom:12px}.time{font-size:44px;font-weight:900;font-variant-numeric:tabular-nums}.caption{display:block;color:var(--muted);font-size:12px;margin-top:12px}.meta{display:flex;justify-content:center;gap:24px;color:var(--muted);font-size:12px}.actions{display:flex;justify-content:center;gap:9px;margin-top:18px}.btn{border:0;border-radius:13px;padding:12px 18px;font-weight:900;background:var(--ink);color:white}.primary{background:var(--green)}.warn{background:var(--orange)}.ghost{background:white;color:var(--ink);border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}.side{display:grid;gap:16px}.knowledge .list{max-height:460px;overflow:auto;padding-right:4px}.toolbar{display:flex;gap:6px;margin:14px 0}.toolbar button{border:0;border-radius:999px;padding:8px 12px;background:transparent;color:var(--muted);font-weight:800}.toolbar button.on{background:var(--light);color:var(--green)}.list{display:grid;gap:9px;margin-top:14px}.item{border:1px solid #e6dfd2;border-radius:15px;background:#ffffffe0;padding:13px}.item.done{opacity:.58}.item.done p{text-decoration:line-through;text-decoration-color:#2e6a5455}.item.pinned{border-color:#ec7f4d88;box-shadow:4px 4px 0 #ec7f4d18}.item-top{display:flex;justify-content:space-between;gap:8px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:var(--light);color:var(--green);font-size:11px;font-weight:900}.item p{white-space:pre-wrap;line-height:1.65;margin:12px 0;font-size:15px}.note-edit{width:100%;min-height:118px;margin:12px 0;border:1px solid #9db8d5;border-radius:13px;background:#fffdf8;padding:11px 12px;color:var(--ink);line-height:1.65;font-size:15px;resize:vertical}.note-edit:focus{border-color:var(--blue);box-shadow:0 0 0 3px #6289b822}.item .small{font-size:11px;color:var(--muted)}.mini-actions{display:flex;gap:8px;flex-wrap:wrap}.mini-actions button{border:0;border-radius:9px;background:var(--light);color:var(--green);padding:7px 9px;font-size:12px;font-weight:800}.mini-actions .edit{background:#e7eff8;color:var(--blue)}.mini-actions .save{background:var(--light);color:var(--green)}.mini-actions .cancel{background:#f4eee6;color:#77736b}.mini-actions .delete{background:#f4eee6;color:#9b5a3d}.section{margin-top:16px}.stats{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:16px;margin-top:16px}.goal-num{font-size:46px;font-weight:900}.bar{height:12px;background:#e7e1d7;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--green),var(--green)8px,#3d8067 8px,#3d8067 13px)}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric b{font-size:34px}.quote{background:var(--ink);color:white}.trend{display:grid;grid-template-columns:repeat(7,1fr);align-items:end;gap:8px;height:160px}.col{text-align:center;color:var(--muted);font-size:10px}.track{height:112px;background:#ebe6dc;border-radius:9px;display:flex;align-items:end;overflow:hidden}.fill{width:100%;min-height:3px;background:var(--green)}.records .item{display:grid;grid-template-columns:90px 80px 1fr 100px 80px auto;align-items:center;gap:10px}.empty{color:var(--muted);text-align:center;padding:30px 10px}.hide{display:none}@media(max-width:900px){.wrap{width:calc(100% - 20px)}.top{align-items:flex-start}.brand small,.chip{display:none}.grid,.stats,.fields,.task-form,.note-form{grid-template-columns:1fr}.card{padding:20px 14px;border-radius:22px}.row{align-items:flex-start;flex-direction:column}.switch{width:100%}.switch button{flex:1}.timer{min-height:286px}.ring{width:224px;height:224px}.inner{width:198px;height:198px}.time{font-size:32px}.actions,.meta{flex-direction:column}.actions .btn{width:100%}.knowledge .list{max-height:none;overflow:visible}.metrics{grid-template-columns:1fr 1fr}.records .item{display:block}.records .item>*{display:block;margin:6px 0}.trend{height:140px}}
</style>
</head>
<body>
<div class='wrap'>
<header class='top'><div class='brand'><span class='mark'></span><span><b>上岸计时局</b><small>把今天认真过完</small></span></div><div class='chip' id='today'></div></header>
<main>
<section class='grid'>
<div class='card'><div class='row'><div><p class='eyebrow'>FOCUS ROOM</p><h1>这次，专注做什么？</h1></div><div class='switch'><button id='upBtn' class='on'>正计时</button><button id='downBtn'>倒计时</button></div></div><div class='fields'><select id='subject'><option>行测</option><option>申论</option><option>常识</option><option>面试</option><option>其他</option></select><select id='taskSelect'><option value=''>不关联待办</option></select></div><div class='fields' id='countdownBox' style='display:none'><input id='minutes' type='number' min='1' max='720' value='50'><button class='btn ghost' id='set50'>设为 50 分钟</button></div><div class='timer'><div class='ring' id='ring'><div class='inner'><div><span class='status' id='status'>准备开始</span><div class='time' id='clock'>00:00:00</div><span class='caption' id='caption'>自由正计时</span></div></div></div></div><div class='meta'><span>本次专注 <b id='focusNow'>0 秒</b></span><span>暂停累计 <b id='pauseNow'>0 秒</b></span></div><div class='actions'><button class='btn primary' id='start'>开始专注</button><button class='btn warn hide' id='pause'>暂停一下</button><button class='btn ghost hide' id='reset'>重置</button><button class='btn ghost' id='finish' disabled>结束并记录</button></div></div>
<aside class='card knowledge'><div class='row'><div><p class='eyebrow'>KNOWLEDGE NOTES</p><h2>重要知识点</h2></div><span class='badge' id='noteCount'>0 条待掌握</span></div><form class='note-form' id='noteForm'><select id='noteSubject'><option>行测</option><option>申论</option><option>常识</option><option>面试</option><option>其他</option></select><textarea id='noteText' placeholder='把不会、容易混淆或需要反复记忆的知识点写在这里……' required></textarea><label class='badge'><input id='notePin' type='checkbox'> 置顶</label><button class='btn'>记下</button></form><div class='toolbar'><button data-filter='learning' class='on'>待掌握</button><button data-filter='all'>全部</button><button data-filter='mastered'>已掌握</button></div><div class='list' id='notes'></div></aside>
</section>
<section class='grid section'><div class='card'><div class='row'><div><p class='eyebrow'>TO-DO</p><h2>学习待办</h2></div><span class='badge' id='taskCount'>0 项未完成</span></div><form class='task-form' id='taskForm'><input id='taskTitle' placeholder='例如：完成一套资料分析题' required><select id='taskSubject'><option>行测</option><option>申论</option><option>常识</option><option>面试</option><option>其他</option></select><input id='taskMinutes' type='number' min='1' max='720' value='50'><button class='btn'>加入待办</button></form><div class='list' id='tasks'></div></div><div class='card'><div class='row'><div><p class='eyebrow'>LAST 7 DAYS</p><h2>近七天专注</h2></div><b id='weekTotal'>共 0 秒</b></div><div class='trend' id='trend'></div></div></section>
<section class='stats'><div class='card'><div class='row'><div><p class='eyebrow'>TODAY</p><h2>今日专注目标</h2></div><button class='btn ghost' id='goalBtn'>设置</button></div><div class='goal-num' id='goalPct'>0%</div><div class='bar'><span id='goalBar'></span></div><p id='goalText'>已专注 0 秒 / 目标 4 小时</p></div><div class='metrics'><div class='card metric'><span>连续专注</span><br><b id='streak'>0</b> 天</div><div class='card metric'><span>今日完成</span><br><b id='doneTasks'>0</b> 项</div></div><div class='card quote'><p id='quote'>不追赶别人，只完成今天的刻度。</p><small>今日提醒</small></div></section>
<section class='card section records'><div class='row'><div><p class='eyebrow'>FOCUS LOG</p><h2>专注记录</h2></div><span id='recordTotal'>共记录 0 次</span></div><div class='list' id='records'></div></section>
</main>
</div>
<script>
const KEY='focus-timer-data-v1';
const $=id=>document.getElementById(id);
const q='不追赶别人，只完成今天的刻度。|把难题拆小，把时间坐稳。|先完成，再完善。|今天留下的每一分钟，都会在考场上回答你。|慢一点没有关系，别停在原地。'.split('|');
let data=load(),mode='countup',active=null,filter='learning',editNoteId=null;
function load(){try{let x=JSON.parse(localStorage.getItem(KEY))||{};return{settings:{dailyGoalMinutes:x.settings?.dailyGoalMinutes||240},tasks:Array.isArray(x.tasks)?x.tasks:[],knowledgePoints:Array.isArray(x.knowledgePoints)?x.knowledgePoints:[],sessions:Array.isArray(x.sessions)?x.sessions:[]}}catch{return{settings:{dailyGoalMinutes:240},tasks:[],knowledgePoints:[],sessions:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function id(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}
function day(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function dur(s){s=Math.max(0,Math.floor(s));let h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;if(h)return h+' 小时 '+m+' 分钟';if(m)return m+' 分钟';return r+' 秒'}
function clk(s){s=Math.max(0,Math.floor(s));return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,'0')).join(':')}
function esc(v){return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll(String.fromCharCode(34),'&quot;').replaceAll(String.fromCharCode(39),'&#039;')}
function nowFocus(){if(!active)return 0;return active.focus+(active.state==='run'?Math.floor((Date.now()-active.last)/1000):0)}
function nowPause(){if(!active)return 0;return active.pause+(active.state==='pause'?Math.floor((Date.now()-active.pauseAt)/1000):0)}
function commit(){if(!active)return;if(active.state==='run'){active.focus=nowFocus();active.last=Date.now()}if(active.state==='pause'){active.pause=nowPause();active.pauseAt=Date.now()}}
function setMode(m){if(active)return;mode=m;$('upBtn').classList.toggle('on',m==='countup');$('downBtn').classList.toggle('on',m==='countdown');$('countdownBox').style.display=m==='countdown'?'grid':'none';renderTimer()}
function start(){if(!active){active={id:id(),mode,subject:$('subject').value,taskId:$('taskSelect').value,target:Math.max(1,+$('minutes').value||50)*60,focus:0,pause:0,start:Date.now(),last:Date.now(),pauseAt:null,state:'run'}}else if(active.state!=='run'){commit();active.state='run';active.last=Date.now();active.pauseAt=null}render()}
function pause(){if(!active||active.state!=='run')return;commit();active.state='pause';active.last=null;active.pauseAt=Date.now();render()}
function resetTimer(){if(!active)return;let has=nowFocus()>0||nowPause()>0;if(has&&!confirm('确定要重置当前计时吗？本次未保存的专注时长不会记录。'))return;active=null;render()}
function finish(){if(!active||nowFocus()<1)return;commit();let task=data.tasks.find(t=>t.id===active.taskId);let content=prompt('这次学习了什么？',task?.title||'');if(content===null)return;content=content.trim()||'未填写内容';let complete=confirm('这次是否完成目标？点“确定”记为完成，点“取消”记为有进展。')?'完成':'有进展';let end=Date.now();data.sessions.unshift({id:active.id,date:day(new Date(end)),subject:active.subject,taskId:active.taskId,taskTitle:task?.title||'',content,completion:complete,focusSeconds:active.focus,pauseSeconds:active.pause,mode:active.mode,targetSeconds:active.target,startedAt:active.start,endedAt:end});if(task&&complete==='完成'){task.completed=true;task.completedAt=end}active=null;save();render()}
function renderTimer(){let f=nowFocus(),p=nowPause(),target=active?.target||Math.max(1,+$('minutes').value||50)*60,currentMode=active?.mode||mode;let show=currentMode==='countdown'?Math.max(0,target-f):f;$('clock').textContent=clk(show);$('focusNow').textContent=dur(f);$('pauseNow').textContent=dur(p);let ratio=currentMode==='countdown'?Math.min(f/target,1):Math.min(f%3600/3600,1);$('ring').style.setProperty('--deg',ratio*360+'deg');$('finish').disabled=!active||f<1;$('start').classList.toggle('hide',active?.state==='run');$('pause').classList.toggle('hide',active?.state!=='run');$('reset').classList.toggle('hide',!active);$('start').textContent=active?'继续专注':'开始专注';$('status').textContent=active?.state==='run'?'正在专注':active?'计时已暂停':'准备开始';$('caption').textContent=active?(data.tasks.find(t=>t.id===active.taskId)?.title||active.subject):(currentMode==='countdown'?'目标 '+dur(target):'自由正计时');if(active&&active.state==='run'&&active.mode==='countdown'&&f>=active.target){alert('倒计时结束了');finish()}}
function addTask(e){e.preventDefault();data.tasks.unshift({id:id(),title:$('taskTitle').value.trim(),subject:$('taskSubject').value,estimateMinutes:+$('taskMinutes').value||50,completed:false,createdAt:Date.now(),completedAt:null});e.target.reset();$('taskMinutes').value=50;save();render()}
function renderTasks(){let open=data.tasks.filter(t=>!t.completed).length,selected=$('taskSelect').value;$('taskCount').textContent=open+' 项未完成';$('taskSelect').innerHTML='<option value='+'\''+'\''+'>不关联待办</option>'+data.tasks.filter(t=>!t.completed).map(t=>`<option value='${esc(t.id)}'>${esc(t.title)} · ${t.estimateMinutes} 分钟</option>`).join('');$('taskSelect').value=active?.taskId||selected;$('tasks').innerHTML=data.tasks.length?data.tasks.slice().sort((a,b)=>a.completed-b.completed||b.createdAt-a.createdAt).map(t=>`<div class='item ${t.completed?'done':''}'><div class='item-top'><span><input type='checkbox' data-done='${esc(t.id)}' ${t.completed?'checked':''}> <b>${esc(t.title)}</b></span><span class='badge'>${esc(t.subject)}</span></div><p class='small'>预计 ${t.estimateMinutes} 分钟</p><div class='mini-actions'>${t.completed?'':`<button data-focus='${esc(t.id)}'>去专注</button>`}<button class='delete' data-del-task='${esc(t.id)}'>删除</button></div></div>`).join(''):`<div class='empty'>还没有待办，先写下今天最重要的一件事。</div>`}
function taskClick(e){let t;if(e.target.dataset.focus){t=data.tasks.find(x=>x.id===e.target.dataset.focus);if(!t)return;$('taskSelect').value=t.id;$('subject').value=t.subject;$('minutes').value=t.estimateMinutes;setMode('countdown');scrollTo({top:0,behavior:'smooth'})}if(e.target.dataset.delTask){data.tasks=data.tasks.filter(x=>x.id!==e.target.dataset.delTask);save();render()}}
function taskChange(e){if(e.target.dataset.done){let t=data.tasks.find(x=>x.id===e.target.dataset.done);if(!t)return;t.completed=e.target.checked;t.completedAt=t.completed?Date.now():null;save();render()}}
function addNote(e){e.preventDefault();let content=$('noteText').value.trim();if(!content)return;data.knowledgePoints.unshift({id:id(),subject:$('noteSubject').value,content,pinned:$('notePin').checked,mastered:false,createdAt:Date.now(),masteredAt:null});e.target.reset();filter='learning';save();render()}
function renderNotes(){let learn=data.knowledgePoints.filter(n=>!n.mastered).length;$('noteCount').textContent=learn+' 条待掌握';document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('on',b.dataset.filter===filter));let arr=data.knowledgePoints.filter(n=>filter==='all'||(filter==='learning'?!n.mastered:n.mastered)).sort((a,b)=>b.pinned-a.pinned||a.mastered-b.mastered||b.createdAt-a.createdAt);$('notes').innerHTML=arr.length?arr.map(n=>{let d=new Date(n.createdAt||Date.now()),editing=editNoteId===n.id;return `<div class='item ${n.pinned?'pinned':''} ${n.mastered?'done':''}'><div class='item-top'><span class='badge'>${esc(n.subject)}</span><button class='badge' data-pin='${esc(n.id)}'>${n.pinned?'已置顶':'置顶'}</button></div>${editing?`<textarea class='note-edit' data-note-edit-input='${esc(n.id)}'>${esc(n.content)}</textarea>`:`<p>${esc(n.content)}</p>`}<div class='item-top'><span class='small'>${d.getMonth()+1}月${d.getDate()}日记下</span><div class='mini-actions'>${editing?`<button class='save' data-save-note='${esc(n.id)}'>保存</button><button class='cancel' data-cancel-note='${esc(n.id)}'>取消</button>`:`<button class='edit' data-edit-note='${esc(n.id)}'>编辑</button><button data-master='${esc(n.id)}'>${n.mastered?'重新学习':'标记掌握'}</button><button class='delete' data-del-note='${esc(n.id)}'>删除</button>`}</div></div></div>`}).join(''):`<div class='empty'>暂时没有知识点。遇到不会的，就立刻记下来。</div>`}
function noteClick(e){let n;if(e.target.dataset.filter){filter=e.target.dataset.filter;renderNotes()}if(e.target.dataset.pin){n=data.knowledgePoints.find(x=>x.id===e.target.dataset.pin);if(!n)return;n.pinned=!n.pinned;save();renderNotes()}if(e.target.dataset.editNote){n=data.knowledgePoints.find(x=>x.id===e.target.dataset.editNote);if(!n)return;editNoteId=n.id;renderNotes();requestAnimationFrame(()=>{let input=$('notes').querySelector('[data-note-edit-input]');input?.focus();input?.setSelectionRange(input.value.length,input.value.length)})}if(e.target.dataset.saveNote){n=data.knowledgePoints.find(x=>x.id===e.target.dataset.saveNote);let input=e.target.closest('.item')?.querySelector('[data-note-edit-input]');if(!n||!input)return;let next=input.value.trim();if(!next){alert('知识点内容不能为空。');return}n.content=next;n.updatedAt=Date.now();editNoteId=null;save();renderNotes()}if(e.target.dataset.cancelNote){editNoteId=null;renderNotes()}if(e.target.dataset.master){n=data.knowledgePoints.find(x=>x.id===e.target.dataset.master);if(!n)return;n.mastered=!n.mastered;n.masteredAt=n.mastered?Date.now():null;save();renderNotes()}if(e.target.dataset.delNote){if(editNoteId===e.target.dataset.delNote)editNoteId=null;data.knowledgePoints=data.knowledgePoints.filter(x=>x.id!==e.target.dataset.delNote);save();renderNotes()}}
function todaySeconds(){return data.sessions.filter(s=>s.date===day()).reduce((a,s)=>a+s.focusSeconds,0)+(active&&day(new Date(active.start))===day()?nowFocus():0)}
function streak(){let set=new Set(data.sessions.filter(s=>s.focusSeconds>0).map(s=>s.date));if(active&&nowFocus()>0)set.add(day());let d=new Date();if(!set.has(day(d)))d.setDate(d.getDate()-1);let n=0;while(set.has(day(d))){n++;d.setDate(d.getDate()-1)}return n}
function renderStats(){let total=todaySeconds(),goal=data.settings.dailyGoalMinutes*60,p=Math.min(100,Math.round(total/goal*100));$('goalPct').textContent=p+'%';$('goalBar').style.width=p+'%';$('goalText').textContent='已专注 '+dur(total)+' / 目标 '+dur(goal);$('streak').textContent=streak();$('doneTasks').textContent=data.tasks.filter(t=>t.completedAt&&day(new Date(t.completedAt))===day()).length;$('recordTotal').textContent='共记录 '+data.sessions.length+' 次';$('weekTotal').textContent='共 '+dur(lastDays().reduce((a,d)=>a+d.seconds,0));$('quote').textContent=q[new Date().getDate()%q.length]}
function lastDays(){return Array.from({length:7},(_,i)=>{let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-(6-i));let k=day(d);return{label:i===6?'今天':'日一二三四五六'[d.getDay()],seconds:data.sessions.filter(s=>s.date===k).reduce((a,s)=>a+s.focusSeconds,0)}})}
function renderTrend(){let ds=lastDays(),max=Math.max(1,...ds.map(d=>d.seconds),data.settings.dailyGoalMinutes*60);$('trend').innerHTML=ds.map(d=>`<div class='col'><div>${d.seconds?dur(d.seconds):''}</div><div class='track'><span class='fill' style='height:${d.seconds?Math.max(3,d.seconds/max*100):2}%'></span></div><div>${d.label}</div></div>`).join('')}
function renderRecords(){$('records').innerHTML=data.sessions.length?data.sessions.slice(0,12).map(s=>`<div class='item'><span class='small'>${new Date(s.endedAt).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span><span class='badge'>${esc(s.subject)}</span><b>${esc(s.content)}</b><span>${dur(s.focusSeconds)}</span><span class='badge'>${esc(s.completion)}</span><button class='btn ghost' data-del-record='${esc(s.id)}'>删除</button></div>`).join(''):`<div class='empty'>第一段专注结束后，记录会出现在这里。</div>`}
function recordClick(e){if(e.target.dataset.delRecord){data.sessions=data.sessions.filter(s=>s.id!==e.target.dataset.delRecord);save();render()}}
function render(){renderTimer();renderTasks();renderNotes();renderStats();renderTrend();renderRecords();save()}
$('today').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});$('upBtn').onclick=()=>setMode('countup');$('downBtn').onclick=()=>setMode('countdown');$('set50').onclick=()=>$('minutes').value=50;$('start').onclick=start;$('pause').onclick=pause;$('reset').onclick=resetTimer;$('finish').onclick=finish;$('taskForm').onsubmit=addTask;$('tasks').onclick=taskClick;$('tasks').onchange=taskChange;$('noteForm').onsubmit=addNote;$('notes').onclick=noteClick;document.querySelector('.toolbar').onclick=noteClick;$('goalBtn').onclick=()=>{let v=prompt('每天计划专注多少分钟？',data.settings.dailyGoalMinutes);if(v){data.settings.dailyGoalMinutes=Math.max(10,+v||240);save();render()}};$('records').onclick=recordClick;document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});setInterval(renderTimer,500);setInterval(renderStats,5000);render();
</script>
